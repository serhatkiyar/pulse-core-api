name: Build and Deploy Code

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DATABASE_HOST: localhost
      DATABASE_NAME: pulse_db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD || 'password123' }}
      SECRET_KEY: ${{ secrets.SECRET_KEY || '09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7' }}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      GEMINI_API_KEY: test-gemini-key
      EMBEDDING_MODEL: gemini-embedding-001
      EMBEDDING_DIMENSIONS: 768
      LLM_MODEL: gemini-3.5-flash-lite

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.DATABASE_PASSWORD || 'password123' }}
          POSTGRES_DB: pulse_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: pulling git repo
        uses: actions/checkout@v4

      - name: Install python version 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update pip
        run: python -m pip install --upgrade pip

      - name: Install all dependencies
        run: pip install -r requirements.txt

      - name: test with pytest
        run: pytest
